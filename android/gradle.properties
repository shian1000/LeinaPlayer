# Template default (-Xmx8G) exceeds this machine's 7.6 GB RAM; it got CustomMapMarker's build OOM-killed.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Flutter's split APKs number themselves ABI × 1000 + build, above any universal APK; the app's
# build.gradle.kts numbers every APK build × 10 + variant instead (docs/agent-notes/releases.md).
force-version-code-ignoring-abi=true
